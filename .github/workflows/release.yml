name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check the tag matches the app version
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Packaging/Info.plist)
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Test
        run: swift test

      - name: Build the app, zip and disk image
        run: |
          scripts/build-app.sh --zip --dmg
          codesign --verify --deep --strict build/KinVault.app
          cd build
          shasum -a 256 KinVault.dmg KinVault.zip > SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/KinVault.dmg build/KinVault.zip build/SHA256SUMS.txt \
            --title "KinVault ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
