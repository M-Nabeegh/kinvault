name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: swift test
      - name: Build app bundle
        run: scripts/build-app.sh --zip
      - uses: actions/upload-artifact@v4
        with:
          name: KinVault
          path: build/KinVault.zip
