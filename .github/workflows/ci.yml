name: KinVault quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore Linux Rollup binary
        # npm can omit platform-specific optional packages from a lockfile
        # created on macOS; the Linux runner needs Rollup's native binary.
        run: npm install --no-save --no-package-lock --ignore-scripts @rollup/rollup-linux-x64-gnu@4.62.4
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
